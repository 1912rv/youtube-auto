name: Generate YouTube Short

on:
  push:
    branches:
      - main
    paths:
      - "script.py"
      - "requirements.txt"
      - "piece_assets/**"
      - ".github/workflows/youtube.yml"
  workflow_dispatch:
  schedule:
    # 00:00, 04:00, 06:00, 12:00, 19:00 IST (UTC+5:30)
    - cron: "30 18 * * *"
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 13 * * *"

concurrency:
  group: youtube-short-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore puzzle history
        uses: actions/cache@v4
        with:
          path: /tmp/youtube-auto/puzzle_history.json
          key: puzzle-history-${{ github.run_id }}
          restore-keys: |
            puzzle-history-

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and upload short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          OUTPUT_DIR: /tmp/youtube-auto
          PUZZLE_FETCH_ATTEMPTS: "8"
          MIN_PUZZLE_RATING: "2000"
        run: python script.py