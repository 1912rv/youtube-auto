name: Generate YouTube Short

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload this manual run to YouTube"
        required: true
        default: false
        type: boolean
  schedule:
    # 00:00, 04:00, 06:00, 12:00, 19:00 IST (UTC+5:30)
    - cron: "30 18 * * *"
    - cron: "30 22 * * *"
    - cron: "30 0 * * *"
    - cron: "30 6 * * *"
    - cron: "30 13 * * *"

concurrency:
  group: youtube-short-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate and upload short
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          ALLOW_DAILY_FALLBACK: "false"
          PUZZLE_FETCH_ATTEMPTS: "3"
          MIN_PUZZLE_RATING: "2000"
        run: |
          if [ "${{ github.event_name == 'schedule' || inputs.publish == true }}" = "true" ]; then
            python script.py
          else
            python script.py --preview
          fi

      - name: Save preview video
        if: github.event_name == 'workflow_dispatch' && inputs.publish == false
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-preview
          path: /tmp/youtube-auto/temp_output_short.mp4
          retention-days: 7